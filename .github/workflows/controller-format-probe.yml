name: Controller Format Probe

on:
  push:
    branches:
      - north/i4-control-contract-corrective-20260919

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run repository formatter on owned file
        run: npx oxfmt src/public-operations/control-operations.ts
      - name: Emit exact formatter diff
        run: git diff --no-color -- src/public-operations/control-operations.ts
