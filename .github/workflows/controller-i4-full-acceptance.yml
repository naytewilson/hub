name: Controller I4 Full Acceptance

on:
  push:
    branches:
      - north/i4-control-contract-corrective-20260919

permissions:
  contents: read

env:
  PASEO_E2E_COMMIT: c16d4f14a3ec95485f37aa7fb6201b7c239d9d2a

jobs:
  static-and-db:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm install -g @getpaseo/cli opencode-ai
      - name: Format
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Migrations
        run: npm run db:check
      - name: Build
        run: npm run build

  docker-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Docker smoke
        run: npm run docker:smoke

  browser-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check out exact Paseo source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: getpaseo/paseo
          ref: ${{ env.PASEO_E2E_COMMIT }}
          path: paseo-source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - name: Build exact Paseo source
        working-directory: paseo-source
        run: |
          npm ci
          npm run build:server
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npm run test:e2e:browser

  hub-e2e:
    runs-on: ubuntu-24.04
    env:
      PASEO_E2E_WORKTREE: ${{ github.workspace }}/paseo-source
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check out exact Paseo source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: getpaseo/paseo
          ref: ${{ env.PASEO_E2E_COMMIT }}
          path: paseo-source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - name: Build exact Paseo source
        working-directory: paseo-source
        run: |
          npm ci
          npm run build:server
      - run: npm ci
      - run: npm install -g @anthropic-ai/claude-code@2.1.226 @openai/codex@0.144.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Hub E2E
        run: npm run test:e2e:hub:source
