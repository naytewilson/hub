name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: [self-hosted, Linux, X64, nayte-linux]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate release metadata
        id: release
        env:
          RELEASE_NOTES_PATH: ${{ runner.temp }}/release-notes.md
        run: node scripts/release-metadata.mjs "${{ github.ref_name }}" "$RELEASE_NOTES_PATH"

      - name: Sign in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | podman login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and publish multi-arch release image
        env:
          IMAGE_TAGS: ${{ steps.release.outputs.image_tags }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tags <<< "$IMAGE_TAGS"
          primary="${tags[0]}"
          test -n "$primary"

          podman build \
            --platform linux/amd64,linux/arm64 \
            --manifest "$primary" \
            --label org.opencontainers.image.source=https://github.com/getpaseo/hub \
            --label "org.opencontainers.image.version=${{ steps.release.outputs.version }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label org.opencontainers.image.licenses=Apache-2.0 \
            .

          for tag in "${tags[@]}"; do
            test -n "$tag" || continue
            podman manifest push --all "$primary" "docker://$tag"
          done

      - name: Remove local release manifest
        if: always()
        env:
          IMAGE_TAGS: ${{ steps.release.outputs.image_tags }}
        shell: bash
        run: |
          mapfile -t tags <<< "$IMAGE_TAGS"
          primary="${tags[0]:-}"
          if [ -n "$primary" ]; then
            podman manifest rm "$primary" >/dev/null 2>&1 || true
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/release-notes.md
          RELEASE_TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file "$RELEASE_NOTES_PATH"
            exit 0
          fi

          args=(--verify-tag --title "Paseo Hub $RELEASE_TAG" --notes-file "$RELEASE_NOTES_PATH")
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}"
